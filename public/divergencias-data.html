<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergências de Data - Sistema Bancário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #a0aec0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #2d3748;
            font-size: 36px;
            font-weight: 700;
        }

        .stat-card.warning .number {
            color: #ed8936;
        }

        .divergencias-list {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .list-header {
            background: #f7fafc;
            padding: 20px 30px;
            border-bottom: 2px solid #e2e8f0;
        }

        .list-header h2 {
            color: #2d3748;
            font-size: 20px;
        }

        .divergencia-item {
            padding: 25px 30px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .divergencia-item:hover {
            background: #f7fafc;
        }

        .divergencia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .divergencia-id {
            color: #a0aec0;
            font-size: 12px;
            font-weight: 600;
        }

        .divergencia-status {
            display: inline-block;
            padding: 6px 12px;
            background: #fed7d7;
            color: #c53030;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .registro-card {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }

        .registro-card.selected {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .registro-card h4 {
            color: #4a5568;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .registro-field {
            margin-bottom: 12px;
        }

        .registro-field label {
            color: #a0aec0;
            font-size: 11px;
            display: block;
            margin-bottom: 4px;
        }

        .registro-field .value {
            color: #2d3748;
            font-size: 14px;
            font-weight: 500;
        }

        .registro-field.destaque .value {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
        }

        .vs-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vs-badge {
            background: #ed8936;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #48bb78;
            color: white;
        }

        .btn-primary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-secondary {
            background: #667eea;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #a0aec0;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #2d3748;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #a0aec0;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left: 4px solid #48bb78;
        }

        .toast.error {
            border-left: 4px solid #f56565;
        }

        .filters {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .filters select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            background: white;
        }

        .filters button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .filters button:hover {
            background: #5a67d8;
        }

        /* V.2610011230 */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚠️ Divergências de Data Detectadas</h1>
            <p>Escolha qual data assumir para cada lançamento com divergência</p>
        </div>

        <div class="filters">
            <label>Empresa:</label>
            <select id="empresaFilter">
                <option value="ALLMAX">ALLMAX</option>
                <option value="IMOBEM">IMOBEM</option>
                <option value="SUMMER">SUMMER</option>
            </select>
            <button onclick="carregarDivergencias()">🔄 Atualizar</button>
        </div>

        <div class="stats">
            <div class="stat-card warning">
                <h3>Divergências Pendentes</h3>
                <div class="number" id="totalDivergencias">-</div>
            </div>
            <div class="stat-card">
                <h3>Resolvidas Hoje</h3>
                <div class="number" id="resolvidasHoje">0</div>
            </div>
        </div>

        <div class="divergencias-list">
            <div class="list-header">
                <h2>Lista de Divergências</h2>
            </div>
            <div id="listaContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Carregando divergências...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let divergenciasGlobal = [];
        let resolvidasHoje = 0;

        // Carregar divergências ao iniciar
        window.addEventListener('DOMContentLoaded', () => {
            carregarDivergencias();
        });

        async function carregarDivergencias() {
            const empresa = document.getElementById('empresaFilter').value;
            const container = document.getElementById('listaContainer');

            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Carregando divergências...</p></div>';

            try {
                const response = await fetch(`/api/banco/divergencias-data?empresa=${empresa}`);
                const data = await response.json();

                if (!data.sucesso) {
                    throw new Error(data.erro);
                }

                divergenciasGlobal = data.divergencias;
                document.getElementById('totalDivergencias').textContent = data.total;

                if (data.divergencias.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✅</div>
                            <h3>Nenhuma Divergência Pendente</h3>
                            <p>Todas as datas estão consistentes!</p>
                        </div>
                    `;
                } else {
                    renderizarDivergencias(data.divergencias);
                }

            } catch (err) {
                console.error('Erro ao carregar:', err);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>Erro ao Carregar</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        }

        function renderizarDivergencias(divergencias) {
            const container = document.getElementById('listaContainer');

            container.innerHTML = divergencias.map((div, index) => {
                const r1 = div.registro1;
                const r2 = div.registro2;

                return `
                    <div class="divergencia-item" id="div-${index}">
                        <div class="divergencia-header">
                            <span class="divergencia-id">#${index + 1} - Diferença: ${div.diferenca_dias} dias</span>
                            <span class="divergencia-status">Pendente</span>
                        </div>

                        <div class="comparison">
                            <div class="registro-card" id="reg1-${index}">
                                <h4>📅 Registro no Banco (ID: ${r1.id})</h4>
                                <div class="registro-field destaque">
                                    <label>Data:</label>
                                    <div class="value">${formatarData(r1.data)}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Valor:</label>
                                    <div class="value">R$ ${formatarValor(r1.valor)}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Descrição:</label>
                                    <div class="value">${r1.descricao.substring(0, 50)}...</div>
                                </div>
                                <div class="registro-field">
                                    <label>Status:</label>
                                    <div class="value">${r1.status || 'Não definido'}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Importado em:</label>
                                    <div class="value">${formatarDataHora(r1.importado_em)}</div>
                                </div>
                            </div>

                            <div class="vs-indicator">
                                <div class="vs-badge">VS</div>
                            </div>

                            <div class="registro-card" id="reg2-${index}">
                                <h4>📥 Registro do OFX (ID: ${r2.id})</h4>
                                <div class="registro-field destaque">
                                    <label>Data:</label>
                                    <div class="value">${formatarData(r2.data)}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Valor:</label>
                                    <div class="value">R$ ${formatarValor(r2.valor)}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Descrição:</label>
                                    <div class="value">${r2.descricao.substring(0, 50)}...</div>
                                </div>
                                <div class="registro-field">
                                    <label>Status:</label>
                                    <div class="value">${r2.status || 'Não definido'}</div>
                                </div>
                                <div class="registro-field">
                                    <label>Importado em:</label>
                                    <div class="value">${formatarDataHora(r2.importado_em)}</div>
                                </div>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="btn btn-primary" onclick="resolverDivergencia(${index}, 1, '${r1.data}')">
                                ✓ Usar Data do Banco (${formatarData(r1.data)})
                            </button>
                            <button class="btn btn-secondary" onclick="resolverDivergencia(${index}, 2, '${r2.data}')">
                                ✓ Usar Data do OFX (${formatarData(r2.data)})
                            </button>
                            <button class="btn btn-danger" onclick="ignorarDivergencia(${index})">
                                ✕ Ignorar
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function resolverDivergencia(index, escolha, dataCorreta) {
            const div = divergenciasGlobal[index];
            const r1 = div.registro1;
            const r2 = div.registro2;

            const id_manter = escolha === 1 ? r1.id : r2.id;
            const id_excluir = escolha === 1 ? r2.id : r1.id;
            const motivo = escolha === 1 ? 'Operador escolheu data do banco' : 'Operador escolheu data do OFX';

            const item = document.getElementById(`div-${index}`);
            item.style.opacity = '0.5';

            try {
                const response = await fetch('/api/banco/divergencias-data/resolver', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id_manter,
                        id_excluir,
                        data_correta: dataCorreta.split('T')[0],
                        motivo
                    })
                });

                const result = await response.json();

                if (!result.sucesso) {
                    throw new Error(result.erro);
                }

                mostrarToast('Divergência resolvida com sucesso!', 'success');
                resolvidasHoje++;
                document.getElementById('resolvidasHoje').textContent = resolvidasHoje;

                item.remove();

                const totalAtual = parseInt(document.getElementById('totalDivergencias').textContent);
                document.getElementById('totalDivergencias').textContent = totalAtual - 1;

                if (totalAtual - 1 === 0) {
                    document.getElementById('listaContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✅</div>
                            <h3>Todas as Divergências Resolvidas!</h3>
                            <p>Excelente trabalho!</p>
                        </div>
                    `;
                }

            } catch (err) {
                console.error('Erro ao resolver:', err);
                mostrarToast('Erro ao resolver divergência: ' + err.message, 'error');
                item.style.opacity = '1';
            }
        }

        function ignorarDivergencia(index) {
            if (!confirm('Tem certeza que deseja ignorar esta divergência? Ela permanecerá no sistema.')) {
                return;
            }

            const item = document.getElementById(`div-${index}`);
            item.remove();

            const totalAtual = parseInt(document.getElementById('totalDivergencias').textContent);
            document.getElementById('totalDivergencias').textContent = totalAtual - 1;
        }

        function formatarData(data) {
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function formatarDataHora(data) {
            const d = new Date(data);
            return d.toLocaleString('pt-BR');
        }

        function formatarValor(valor) {
            return Math.abs(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function mostrarToast(mensagem, tipo) {
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `
                <span style="font-size: 24px;">${tipo === 'success' ? '✓' : '✕'}</span>
                <span>${mensagem}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
