<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Categorias Bancárias — V.260912010000</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .categorias-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .categoria-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .categoria-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102,126,234,0.2);
        }

        .categoria-card.inativa {
            opacity: 0.5;
            background: #f3f4f6;
        }

        .categoria-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .categoria-icone {
            font-size: 32px;
            margin-right: 10px;
        }

        .categoria-nome {
            font-weight: 600;
            font-size: 16px;
            flex: 1;
        }

        .categoria-tipo {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .tipo-RECEITA {
            background: #d1fae5;
            color: #065f46;
        }

        .tipo-DESPESA {
            background: #fee2e2;
            color: #991b1b;
        }

        .categoria-acoes {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .categoria-acoes button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .mensagem {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .mensagem.sucesso {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .mensagem.erro {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Gerenciar Categorias Bancárias</h1>
            <p>Crie, edite e organize suas categorias</p>
        </div>

        <div class="content">
            <!-- MENSAGENS -->
            <div id="mensagem"></div>

            <!-- FORMULÁRIO NOVA CATEGORIA -->
            <div class="section">
                <h2>➕ Nova Categoria</h2>
                <form id="formNova">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                        <div class="form-group">
                            <label>Empresa *</label>
                            <select id="empresa" required>
                                <option value="">Selecione...</option>
                                <option value="ALLMAX">ALLMAX</option>
                                <option value="IMOBEM">IMOBEM</option>
                                <option value="IMOBAN">IMOBAN</option>
                                <option value="SUMMER">SUMMER</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Nome da Categoria *</label>
                            <input type="text" id="nome" placeholder="Ex: Receita - Mensalidade" required>
                        </div>

                        <div class="form-group">
                            <label>Tipo *</label>
                            <select id="tipo" required>
                                <option value="">Selecione...</option>
                                <option value="RECEITA">RECEITA</option>
                                <option value="DESPESA">DESPESA</option>
                                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Ícone</label>
                            <input type="text" id="icone" placeholder="Ex: 💰" maxlength="2">
                        </div>

                        <div class="form-group">
                            <label>Cor (hex)</label>
                            <input type="text" id="cor" placeholder="Ex: #22c55e" pattern="#[0-9a-fA-F]{6}">
                        </div>

                        <div class="form-group">
                            <label>Ordem</label>
                            <input type="number" id="ordem" placeholder="Ex: 1" min="1">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 15px;">
                        ➕ Criar Categoria
                    </button>
                </form>
            </div>

            <!-- LISTAR CATEGORIAS -->
            <div class="section">
                <h2>📋 Categorias Existentes</h2>

                <div style="margin-bottom: 15px;">
                    <label>Filtrar por empresa:</label>
                    <select id="filtroEmpresa" onchange="carregarCategorias()" style="width: 200px;">
                        <option value="ALLMAX">ALLMAX</option>
                        <option value="IMOBEM">IMOBEM</option>
                        <option value="IMOBAN">IMOBAN</option>
                        <option value="SUMMER">SUMMER</option>
                    </select>
                </div>

                <div id="categorias" class="loading">
                    Carregando categorias...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/banco/categorias';

        // Carregar categorias ao iniciar
        window.addEventListener('DOMContentLoaded', () => {
            carregarCategorias();
        });

        // Formulário de nova categoria
        document.getElementById('formNova').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                empresa: document.getElementById('empresa').value,
                nome: document.getElementById('nome').value,
                tipo: document.getElementById('tipo').value,
                icone: document.getElementById('icone').value || '📌',
                cor: document.getElementById('cor').value || '#6b7280',
                ordem: parseInt(document.getElementById('ordem').value) || 999
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const result = await response.json();

                if (response.ok) {
                    mostrarMensagem('✅ ' + result.mensagem, 'sucesso');
                    document.getElementById('formNova').reset();
                    carregarCategorias();
                } else {
                    mostrarMensagem('❌ ' + result.erro, 'erro');
                }

            } catch (err) {
                mostrarMensagem('❌ Erro ao criar categoria: ' + err.message, 'erro');
            }
        });

        // Carregar categorias
        async function carregarCategorias() {
            const empresa = document.getElementById('filtroEmpresa').value;
            const container = document.getElementById('categorias');

            container.innerHTML = '<div class="loading">Carregando...</div>';

            try {
                const response = await fetch(`${API_URL}?empresa=${empresa}`);
                const result = await response.json();

                if (result.categorias.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #999;">Nenhuma categoria cadastrada para ' + empresa + '</p>';
                    return;
                }

                container.innerHTML = '';
                container.className = 'categorias-lista';

                result.categorias.forEach(cat => {
                    const card = document.createElement('div');
                    card.className = 'categoria-card' + (cat.ativo ? '' : ' inativa');
                    card.innerHTML = `
                        <div class="categoria-header">
                            <span class="categoria-icone">${cat.icone}</span>
                            <span class="categoria-nome">${cat.nome}</span>
                        </div>
                        <div>
                            <span class="categoria-tipo tipo-${cat.tipo}">${cat.tipo}</span>
                            ${cat.ativo ? '' : '<span style="margin-left: 8px; color: #999; font-size: 12px;">INATIVA</span>'}
                        </div>
                        <div style="margin-top: 8px; font-size: 12px; color: #999;">
                            Base: ${cat.ordem} | Usada: ${cat.vezes_usada || 0}x | 📊 Dinâmica: ${cat.ordem_dinamica ? cat.ordem_dinamica.toFixed(1) : cat.ordem}
                        </div>
                        <div style="margin-top: 4px; font-size: 11px; color: #999;">
                            Cor: ${cat.cor}
                        </div>
                        <div class="categoria-acoes">
                            <button class="btn btn-secondary" onclick="editarCategoria(${cat.id})">
                                ✏️ Editar
                            </button>
                            ${cat.ativo ?
                                `<button class="btn btn-danger" onclick="desativarCategoria(${cat.id})">🗑️ Desativar</button>` :
                                `<button class="btn btn-primary" onclick="ativarCategoria(${cat.id})">✅ Ativar</button>`
                            }
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar categorias</p>';
            }
        }

        // Editar categoria
        async function editarCategoria(id) {
            const novoNome = prompt('Novo nome:');
            if (!novoNome) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: novoNome })
                });

                const result = await response.json();

                if (response.ok) {
                    mostrarMensagem('✅ ' + result.mensagem, 'sucesso');
                    carregarCategorias();
                } else {
                    mostrarMensagem('❌ ' + result.erro, 'erro');
                }

            } catch (err) {
                mostrarMensagem('❌ Erro: ' + err.message, 'erro');
            }
        }

        // Desativar categoria
        async function desativarCategoria(id) {
            if (!confirm('Desativar esta categoria?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    mostrarMensagem('✅ ' + result.mensagem, 'sucesso');
                    carregarCategorias();
                } else {
                    mostrarMensagem('❌ ' + result.erro, 'erro');
                }

            } catch (err) {
                mostrarMensagem('❌ Erro: ' + err.message, 'erro');
            }
        }

        // Ativar categoria
        async function ativarCategoria(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ativo: true })
                });

                const result = await response.json();

                if (response.ok) {
                    mostrarMensagem('✅ Categoria ativada!', 'sucesso');
                    carregarCategorias();
                } else {
                    mostrarMensagem('❌ ' + result.erro, 'erro');
                }

            } catch (err) {
                mostrarMensagem('❌ Erro: ' + err.message, 'erro');
            }
        }

        // Mostrar mensagem
        function mostrarMensagem(texto, tipo) {
            const container = document.getElementById('mensagem');
            container.innerHTML = `<div class="mensagem ${tipo}">${texto}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
